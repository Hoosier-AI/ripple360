<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ripple Boulder — 360° Virtual Tour</title>
  <meta name="description" content="Take a 360° virtual tour of Ripple Boulder climbing gym.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧗</text></svg>">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin@5/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5/index.css">
  <!-- ?v= is bumped whenever tour.js or style.css changes. Browsers cache both
       aggressively, and a stale tour.js silently keeps the old navigation links
       (which reads as "the fix didn't work"), so the URL has to change too. -->
  <link rel="stylesheet" href="style.css?v=20260813">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js",
      "@photo-sphere-viewer/gallery-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin@5/index.module.js",
      "@photo-sphere-viewer/virtual-tour-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5/index.module.js",
      "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin@5/index.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewer"></div>

  <header class="brand">
    <div class="brand-name">RIPPLE<span>BOULDER</span></div>
    <div class="brand-sub">360° Virtual Tour</div>
  </header>

  <div class="hint" id="hint">Drag to look around · Click the arrows to walk through the gym</div>

  <script type="module" src="tour.js?v=20260813"></script>
</body>
</html>
